<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCR Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/e74c0ede07.js" crossorigin="anonymous"></script>

<style>
    body, html {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #121212;
        color: #e0e0e0;
        font-family: 'Ubuntu', sans-serif;
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
        background-color: #1e1e1e;
        padding: 20px 25px;
        border-radius: 8px;
        border: 1px solid #333;
        width: 350px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.35);
        animation: fadeIn 0.3s ease-out;
        position: relative; /* For positioning the question mark */
    }

    /* Main Title - Above tabs */
    .main-title {
        font-size: 20px;
        font-weight: bold;
        color: #fff;
        text-align: center;
        margin-bottom: 5px;
    }

    /* Question mark in bottom right corner */
    .info-btn {
        position: absolute;
        bottom: 15px;
        right: 15px;
        cursor: pointer;
        background: none;
        border: none;
        color: #fff;
        transition: 0.3s ease;
        z-index: 10;
    }

    .info-btn .fa-solid {
        transform: scale(1.2);
        color: #777;
        transition: 0.3s ease;
    }

    .info-btn:hover .fa-solid { 
        color: #fff; 
    }

    /* TAB BAR */
    .tabs {
        display: flex;
        width: 100%;
        justify-content: space-between;
        margin-bottom: 10px;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
    }

    .tab {
        flex: 1;
        text-align: center;
        padding: 10px 0;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: 0.3s ease;
        font-size: 16px;
        font-weight: 500;
    }

    .tab.active {
        color: #fff;
    }

    .tab.disabled {
        color: #555;
        cursor: not-allowed;
        border-bottom: 2px solid transparent;
        opacity: 0.5;
    }

    /* Inputs Container */
    .inputs-container {
        display: flex;
        gap: 10px;
        width: 100%;
        margin-bottom: 10px;
        align-items: flex-start;
    }

    /* Input Group */
    .input-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0; /* Important for equal width distribution */
    }

    .label {
        font-size: 14px;
        color: #cccccc;
        animation: fadeIn 0.3s ease forwards;
        margin-bottom: 5px;
        text-align: center;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        width: 100%; /* Ensure labels take full width */
    }

    .input-box {
        width: 100%;
        padding: 10px;
        background-color: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        font-family: 'Ubuntu';
        text-align: center;
        outline: none;
        transition: border-color 0.3s ease;
        animation: fadeIn 0.3s ease forwards;
        box-sizing: border-box;
        min-width: 0; /* Important for equal width distribution */
    }

    .input-box:focus {
        border-color: #888;
    }

    .input-box.error {
        border-color: #ff4444;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    input[type=number] { 
        -moz-appearance: textfield;
    }

    /* Generate Button - Same size as inputs container */
    .generate-btn {
        width: 100%;
        padding: 10px;
        background-color: #444444;
        color: #ffffff;
        border: 1px solid #666666;
        border-radius: 4px;
        font-family: 'Ubuntu', sans-serif;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
        text-align: center;
        margin-top: 5px;
        box-sizing: border-box;
    }

    .generate-btn:hover {
        background-color: #555555;
        transform: translateY(-1px);
    }

    .generate-btn:active {
        transform: translateY(0);
    }

    .generate-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .generate-btn:disabled:hover {
        background-color: #444444;
        transform: none;
    }

    /* Modal */
    #alert-modal {
        display: none;
        opacity: 0;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.3s ease;
    }

    #alert-modal.show {
        display: flex;
        animation: fadeIn 0.3s ease forwards;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
    }

    .modal-content {
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #333;
        text-align: center;
        width: 250px;
    }

    #alert-ok-btn {
        margin-top: 15px;
        padding: 10px;
        background-color: #007bff;
        color: #fff;
        border: none;
        width: 100%;
        border-radius: 4px;
        cursor: pointer;
    }

    #alert-ok-btn:hover { background-color: #0056b3; }

    /* Info Image Modal */
    #info-modal {
        display: none;
        opacity: 0;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.3s ease;
    }

    #info-modal.show {
        display: flex;
        animation: fadeIn 0.3s ease forwards;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
    }

    .info-modal-content {
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #333;
        text-align: center;
        max-width: 500px;
    }

    .info-image {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        margin-bottom: 15px;
    }

    #info-ok-btn {
        margin-top: 15px;
        padding: 10px;
        background-color: #007bff;
        color: #fff;
        border: none;
        width: 100%;
        border-radius: 4px;
        cursor: pointer;
    }

    #info-ok-btn:hover { background-color: #0056b3; }

    @keyframes fadeIn {
        from { opacity: 0; } 
        to { opacity: 1; }
    }
</style>
</head>

<body>

<div class="container">

    <!-- Question mark in bottom right corner -->
    <button class="info-btn" onclick="showInfo()">
        <i class="fa-solid fa-circle-question"></i>
    </button>

    <!-- Main Title -->
    <div class="main-title">MCR Generator</div>

    <!-- TABS -->
    <div class="tabs">
        <div class="tab active" id="tab-clothes">Clothes</div>
        <div class="tab disabled" id="tab-hair">Hair</div>
        <div class="tab disabled" id="tab-face">Face</div>
    </div>

    <!-- CLOTHES CONTENT -->
    <div id="content-clothes">

        <!-- Inputs side by side -->
        <div class="inputs-container">
            <div class="input-group">
                <div class="label">Rows</div>
                <input id="inputY" type="number" class="input-box" min="3" max="9" value="3">
            </div>
            
            <div class="input-group">
                <div class="label">Columns</div>
                <input id="inputZ" type="number" class="input-box" min="1" max="9" value="1">
            </div>
        </div>

        <!-- Generate Button - Full width like inputs -->
        <button class="generate-btn" id="generate-btn" onclick="generate()">
            Generate
        </button>

    </div>

</div>

<!-- Alert Modal -->
<div id="alert-modal">
    <div class="modal-content">
        <h3 id="alert-message"></h3>
        <button id="alert-ok-btn">OK</button>
    </div>
</div>

<!-- Info Image Modal -->
<div id="info-modal">
    <div class="info-modal-content">
        <img src="https://raw.githubusercontent.com/Paprotk/MCRGenerator/refs/heads/main/image.png" alt="Rows and Columns Explanation" class="info-image">
        <p>Rows represent the horizontal count (3-9)<br>Columns represent the vertical count (1-9)</p>
        <button id="info-ok-btn">OK</button>
    </div>
</div>

<script>
// OFFSETS
const OFFSET_Y = 0x148;
const OFFSET_Z = 0x170;

// Get elements
const inputY = document.getElementById('inputY');
const inputZ = document.getElementById('inputZ');
const generateBtn = document.getElementById('generate-btn');

// Block non-numeric input
function blockNonNumeric(e) {
    // Allow: backspace, delete, tab, escape, enter, decimal point
    if ([46, 8, 9, 27, 13, 110, 190].indexOf(e.keyCode) !== -1 ||
        // Allow: Ctrl+A, Ctrl+C, Ctrl+V, Ctrl+X
        (e.keyCode === 65 && (e.ctrlKey || e.metaKey)) ||
        (e.keyCode === 67 && (e.ctrlKey || e.metaKey)) ||
        (e.keyCode === 86 && (e.ctrlKey || e.metaKey)) ||
        (e.keyCode === 88 && (e.ctrlKey || e.metaKey)) ||
        // Allow: home, end, left, right
        (e.keyCode >= 35 && e.keyCode <= 39)) {
        return;
    }
    
    // Ensure it's a number
    if ((e.shiftKey || (e.keyCode < 48 || e.keyCode > 57)) && (e.keyCode < 96 || e.keyCode > 105)) {
        e.preventDefault();
    }
}

// Validate input and update button state
function validateInputs() {
    const Y = parseInt(inputY.value);
    const Z = parseInt(inputZ.value);
    let isValid = true;
    
    // Validate Rows (3-9)
    if (isNaN(Y) || Y < 3 || Y > 9) {
        inputY.classList.add('error');
        isValid = false;
    } else {
        inputY.classList.remove('error');
    }
    
    // Validate Columns (1-9)
    if (isNaN(Z) || Z < 1 || Z > 9) {
        inputZ.classList.add('error');
        isValid = false;
    } else {
        inputZ.classList.remove('error');
    }
    
    // Update button state
    generateBtn.disabled = !isValid;
    
    return isValid;
}

// Force input to stay within range on blur
function enforceRange(input, min, max) {
    let value = parseInt(input.value);
    if (isNaN(value)) {
        input.value = min;
    } else if (value < min) {
        input.value = min;
    } else if (value > max) {
        input.value = max;
    }
    validateInputs();
}

// Event listeners for input validation
inputY.addEventListener('keydown', blockNonNumeric);
inputZ.addEventListener('keydown', blockNonNumeric);

inputY.addEventListener('input', validateInputs);
inputZ.addEventListener('input', validateInputs);

inputY.addEventListener('blur', () => enforceRange(inputY, 3, 9));
inputZ.addEventListener('blur', () => enforceRange(inputZ, 1, 9));

// Initialize button state
validateInputs();

async function loadTemplate() {
    const response = await fetch("template.package");
    return new Uint8Array(await response.arrayBuffer());
}

function showAlert(msg) {
    const modal = document.getElementById("alert-modal");
    document.getElementById("alert-message").textContent = msg;
    modal.classList.add("show");
    modal.style.display = "flex";
    document.getElementById("alert-ok-btn").onclick = () => {
        modal.style.display = "none";
        modal.classList.remove("show");
    };
}

function showInfo() {
    const modal = document.getElementById("info-modal");
    modal.classList.add("show");
    modal.style.display = "flex";
    document.getElementById("info-ok-btn").onclick = () => {
        modal.style.display = "none";
        modal.classList.remove("show");
    };
}

async function generate() {
    // Double-check validation before generating
    if (!validateInputs()) {
        showAlert("Please enter valid numbers within the specified ranges.");
        return;
    }
    
    const Y = parseInt(inputY.value);
    const Z = parseInt(inputZ.value);

    // Final range check (should already be validated)
    if (Y < 3 || Y > 9 || Z < 1 || Z > 9) {
        showAlert("Rows must be between 3–9 and Columns between 1–9.");
        return;
    }

    try {
        let data = await loadTemplate();
        let modified = new Uint8Array(data);

        modified[OFFSET_Y] = String(Y).charCodeAt(0);
        modified[OFFSET_Z] = String(Z).charCodeAt(0);

        const filename = `Arro_MCR_Clothes${Y}x${Z}.package`;

        const blob = new Blob([modified], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();

        URL.revokeObjectURL(url);
    } catch (error) {
        showAlert("Error generating file. Please try again.");
        console.error("Generation error:", error);
    }
}
</script>

</body>

</html>
